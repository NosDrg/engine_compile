services:
  match-arena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: match_arena_dev
    ports:
      - "8000:8000"
    volumes:
      # Mount trực tiếp code để khi sửa file Python/JS thì hệ thống tự cập nhật ngay
      - ./protocol:/app/protocol
      - ./frontend:/app/frontend
      - ./drivers:/app/drivers
      - ./workspace:/app/workspace
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload