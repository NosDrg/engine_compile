version: '3.8'

services:
  match_arena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: match_arena_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=local_dev_secret_key_2026
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    volumes:
      # Giữ lại SQLite DB và các file bot đã nộp ngay trên máy host
      - ./protocol/save:/app/protocol/save
    restart: unless-stopped