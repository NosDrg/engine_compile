services:
  match-arena:
    build:
      context: .
      dockerfile: Dockerfile
    image: match-arena:latest
    container_name: match_arena_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/protocol
    volumes:
      - ./protocol/save:/app/protocol/save
      - ./frontend:/app/frontend:ro
      - ./workspace:/app/workspace

    # Tùy chọn: Đảm bảo container nhìn thấy đủ CPU cores để CoreAllocator phân chia luồng
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G