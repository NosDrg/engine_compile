<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diễn đàn · Bot Arena</title><link rel="stylesheet" href="css/main.css"><style>.wrap{max-width:1000px;margin:30px auto;padding:20px;position:relative;z-index:1}.chat{height:min(65vh,650px);overflow:auto;background:var(--bg-card);border:1px solid var(--border-card);border-radius:12px;padding:16px}.msg{padding:10px;border-bottom:1px solid var(--border-card)}.msg small{color:var(--text-muted)}.compose{display:flex;gap:10px;margin-top:12px}.compose input{flex:1}.state{min-height:24px}</style></head>
<body><nav class="navbar"><a class="navbar-brand" href="/">⚔ Bot Arena</a><div class="navbar-actions" id="navbar-actions"></div></nav><main class="wrap"><h1>Diễn đàn người chơi</h1><p class="state" id="state" role="status">Đang kết nối…</p><button class="btn btn-secondary btn-sm" id="load-older" type="button" hidden>Tải tin cũ hơn</button><section class="chat" id="chat" aria-live="polite" aria-label="Tin nhắn diễn đàn"></section><form class="compose" id="compose"><input class="form-control" id="message" maxlength="1000" placeholder="Viết tin nhắn (tối đa 1000 ký tự)" required><button class="btn btn-primary">Gửi</button></form></main><script type="module" src="js/forum.js"></script></body></html>
