<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng ký tài khoản Bot Arena – Đấu trường AI miễn phí.">
  <title>Đăng ký – Bot Arena</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/webp" href="assets/logo.webp">
  <link rel="stylesheet" href="css/auth-common.css">
<link rel="stylesheet" href="css/register-page.css">
</head>
<body>
  <a href="/index.html" class="back-home" id="back-to-home">Trang chủ</a>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">

        <h1>Tạo tài khoản</h1>
        <p>Đăng ký miễn phí, bắt đầu lập trình AI ngay</p>
      </div>

      <div class="auth-body">
        <div id="reg-status"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-username">Tên người dùng *</label>
            <div class="input-icon-wrap">

              <input type="text" id="reg-username" class="form-control"
                placeholder="chỉ chữ cái, số, gạch dưới"
                maxlength="32" required autocomplete="username">
            </div>
            <small id="reg-username-hint" class="username-hint"></small>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-display">Tên hiển thị</label>
            <div class="input-icon-wrap">

              <input type="text" id="reg-display" class="form-control"
                placeholder="Tên bạn muốn hiển thị" maxlength="64">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Mật khẩu *</label>
            <div class="input-icon-wrap">

              <input type="password" id="reg-password" class="form-control"
                placeholder="Ít nhất 12 ký tự" required autocomplete="new-password">
              <button type="button" class="btn-eye" id="toggle-pwd1" aria-label="Toggle password visibility" aria-pressed="false">Hi&#7879;n</button>
            </div>
            <div class="password-strength">
              <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
              <span class="strength-label" id="strength-label">Nhập mật khẩu</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm">Xác nhận mật khẩu *</label>
            <div class="input-icon-wrap">

              <input type="password" id="reg-confirm" class="form-control"
                placeholder="Nhập lại mật khẩu" required autocomplete="new-password">
              <button type="button" class="btn-eye" id="toggle-pwd2" aria-label="Toggle password visibility" aria-pressed="false">Hi&#7879;n</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Ngôn ngữ lập trình yêu thích</label>
            <div class="lang-select-grid">
              <div>
                <input type="radio" name="preferred_lang" id="lang-python" value="python" class="lang-option" checked>
                <label for="lang-python" class="lang-label">
                  Python
                </label>
              </div>
              <div>
                <input type="radio" name="preferred_lang" id="lang-cpp" value="cpp" class="lang-option">
                <label for="lang-cpp" class="lang-label">
                  C++
                </label>
              </div>
              <div>
                <input type="radio" name="preferred_lang" id="lang-java" value="java" class="lang-option">
                <label for="lang-java" class="lang-label">
                  Java
                </label>
              </div>
            </div>
          </div>

          <div class="terms-row">
            <input type="checkbox" id="agree-terms" required>
            <label for="agree-terms">
              Tôi đồng ý với <a href="terms.html" id="terms-link">Điều khoản sử dụng</a> và
              <a href="privacy.html" id="privacy-link">Chính sách bảo mật</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-register">
             Tạo tài khoản
          </button>
        </form>
      </div>

      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html" id="link-to-login">Đăng nhập</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script type="module" src="js/register.js"></script>
</body>
</html>
