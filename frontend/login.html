<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập vào Bot Arena để nộp bot và thi đấu.">
  <title>Đăng nhập – Bot Arena</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/webp" href="assets/logo.webp">
  <link rel="stylesheet" href="css/auth-common.css">
  <link rel="stylesheet" href="css/login-page.css">
</head>
<body>
  <a href="/index.html" class="back-home" id="back-to-home">Trang chủ</a>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">

        <h1>Chào mừng trở lại!</h1>
        <p>Đăng nhập để tiếp tục thách đấu</p>
      </div>

      <div class="auth-body">
        <div class="alert alert-error" id="login-status"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-username">Tên người dùng</label>
            <div class="input-icon-wrap">

              <input
                type="text"
                id="login-username"
                name="username"
                class="form-control"
                placeholder="username của bạn"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Mật khẩu</label>
            <div class="input-icon-wrap">

              <input
                type="password"
                id="login-password"
                name="password"
                class="form-control"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              >
              <button type="button" class="btn-eye" id="toggle-password" aria-label="Toggle password visibility" aria-pressed="false">Hi&#7879;n</button>
            </div>
          </div>

          <div class="remember-row">
            <label>
              <input type="checkbox" id="remember-me"> Ghi nhớ đăng nhập
            </label>
            <a href="#" id="forgot-pwd">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login">
            Đăng nhập
          </button>
        </form>

        <div class="divider-text">hoặc</div>

        <a href="guide.html" class="btn btn-secondary btn-block" id="btn-view-guide">
           Xem hướng dẫn viết bot
        </a>
      </div>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html" id="link-to-register">Đăng ký ngay</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
