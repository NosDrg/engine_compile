<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập vào Bot Arena để nộp bot và thi đấu.">
  <title>Đăng nhập – Bot Arena</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
      position: relative; z-index: 1;
    }
    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      overflow: hidden;
      animation: fadeIn 0.4s ease;
    }
    .auth-header {
      padding: 36px 36px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border-card);
    }
    .auth-logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 16px;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .auth-header p { font-size: 0.875rem; color: var(--text-muted); }
    .auth-body { padding: 32px 36px; }
    .auth-footer {
      padding: 20px 36px;
      text-align: center;
      border-top: 1px solid var(--border-card);
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }

    .input-icon-wrap {
      position: relative;
    }
    .input-icon-wrap .icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
    }
    .input-icon-wrap .form-control { padding-left: 38px; }
    .input-icon-wrap .btn-eye {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-faint); cursor: pointer;
      padding: 4px; font-size: 1rem;
      transition: color 0.2s;
    }
    .input-icon-wrap .btn-eye:hover { color: var(--text-muted); }

    .remember-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .remember-row label {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem; color: var(--text-muted); cursor: pointer;
    }
    .remember-row a {
      font-size: 0.85rem;
      color: var(--accent); text-decoration: none;
    }
    .remember-row a:hover { text-decoration: underline; }

    input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: #6366f1;
      cursor: pointer;
    }

    #login-status {
      margin-bottom: 16px;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.85rem;
      display: none;
    }
    #login-status.show { display: flex; }

    .back-home {
      position: absolute;
      z-index: 2;
      top: 20px; left: 24px;
      display: flex; align-items: center; gap: 6px;
      color: var(--text-muted); text-decoration: none;
      font-size: 0.85rem; font-weight: 500;
      transition: color 0.2s;
    }
    .back-home:hover { color: var(--text-main); }
  </style>
</head>
<body>
  <a href="/index.html" class="back-home" id="back-to-home">← Trang chủ</a>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">⚔️</div>
        <h1>Chào mừng trở lại!</h1>
        <p>Đăng nhập để tiếp tục thách đấu</p>
      </div>

      <div class="auth-body">
        <div class="alert alert-error" id="login-status"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-username">Tên người dùng</label>
            <div class="input-icon-wrap">
              <span class="icon">👤</span>
              <input
                type="text"
                id="login-username"
                name="username"
                class="form-control"
                placeholder="username của bạn"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Mật khẩu</label>
            <div class="input-icon-wrap">
              <span class="icon">🔒</span>
              <input
                type="password"
                id="login-password"
                name="password"
                class="form-control"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              >
              <button type="button" class="btn-eye" id="toggle-password" aria-label="Hiện/ẩn mật khẩu">👁️</button>
            </div>
          </div>

          <div class="remember-row">
            <label>
              <input type="checkbox" id="remember-me"> Ghi nhớ đăng nhập
            </label>
            <a href="#" id="forgot-pwd">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login">
            Đăng nhập
          </button>
        </form>

        <div class="divider-text">hoặc</div>

        <a href="guide.html" class="btn btn-secondary btn-block" id="btn-view-guide">
          📖 Xem hướng dẫn viết bot
        </a>
      </div>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html" id="link-to-register">Đăng ký ngay</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
